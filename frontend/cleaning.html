<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleaning Duty — Class Management</title>
<link rel="icon" href="assets/svg/icons.svg#icon-sparkle" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<div class="bg-orbs"></div>
<div id="loading-screen">
  <div class="loader-mark"><svg><use href="assets/svg/icons.svg#icon-sparkle"></use></svg></div>
  <div class="loader-bar"></div>
</div>

<div class="app-shell page-grid page-grid--main-side">
  <div id="tabbar-root"></div>

  <main class="stack stagger">
    <div id="topbar-root" class="topbar"></div>
    <div class="row row--between">
      <h1 class="text-display text-xl">Cleaning Duty</h1>
      <a href="more.html" class="icon-btn" aria-label="Back to More"><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-arrow-left"></use></svg></a>
    </div>

    <section class="glass hero card">
      <p class="text-eyebrow">Today</p>
      <div id="cleaning-today" style="margin-top:10px"></div>
    </section>

    <section class="glass card--tight glass-strong" style="padding:14px">
      <div class="search-bar">
        <svg><use href="assets/svg/icons.svg#icon-search"></use></svg>
        <input id="cl-search" type="text" placeholder="Search by area or student name…">
      </div>
    </section>

    <section id="cleaning-week" class="stack"></section>
  </main>
</div>

<button class="fab" id="fab-add-cleaning" aria-label="Add cleaning duty">
  <svg><use href="assets/svg/icons.svg#icon-plus"></use></svg>
</button>

<!-- Create/Edit cleaning duty modal (admin) -->
<div class="modal-overlay" id="modal-cleaning">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 id="cl-modal-title">Assign Cleaning Duty</h3>
      <button class="icon-btn" data-close-modal><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-x"></use></svg></button>
    </div>
    <form id="cleaning-form" class="stack">
      <input type="hidden" id="cl-id">
      <div class="field">
        <label for="cl-day">Day</label>
        <div class="input-shell">
          <svg><use href="assets/svg/icons.svg#icon-calendar"></use></svg>
          <select id="cl-day" required>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="cl-area">Area</label>
        <div class="input-shell"><input id="cl-area" type="text" placeholder="Classroom, Library, Garden…" required></div>
      </div>
      <div class="field">
        <label>Assign Students</label>
        <div id="cl-students" class="stack" style="max-height:240px;overflow-y:auto;gap:8px"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn--glass" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn--primary" id="cl-submit-btn">Save Duty</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cleaning.js"></script>
</body>
</html>
