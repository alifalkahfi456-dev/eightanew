<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance — Class Management</title>
<link rel="icon" href="assets/svg/icons.svg#icon-sparkle" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  @media print {
    .topbar, #tabbar-root, .fab, .card-link, #student-view .status-picker, #student-view #submit-attendance, .no-print { display: none !important; }
    body { background: #fff !important; }
    .glass { box-shadow: none !important; border: 1px solid #ddd !important; backdrop-filter: none !important; background: #fff !important; }
  }
</style>
</head>
<body>
<div class="bg-orbs"></div>
<div id="loading-screen">
  <div class="loader-mark"><svg><use href="assets/svg/icons.svg#icon-sparkle"></use></svg></div>
  <div class="loader-bar"></div>
</div>

<div class="app-shell page-grid page-grid--main-side">
  <div id="tabbar-root"></div>

  <main class="stack stagger">
    <div id="topbar-root" class="topbar"></div>
    <div class="row row--between">
      <h1 class="text-display text-xl">Attendance</h1>
    </div>

    <!-- ============ STUDENT VIEW ============ -->
    <div id="student-view" class="stack hidden">
      <section class="glass card" id="attendance-widget">
        <div class="skeleton sk-line" style="width:40%"></div>
        <div class="skeleton sk-line" style="width:70%"></div>
      </section>

      <section class="scroll-x" id="stats-row"></section>

      <section class="glass card">
        <div class="row row--between" style="margin-bottom:12px">
          <h3 class="card-title">My History</h3>
        </div>
        <div class="row row--wrap" style="margin-bottom:12px" id="student-filter-pills"></div>
        <div id="student-history" class="list-card"></div>
      </section>
    </div>

    <!-- ============ ADMIN VIEW ============ -->
    <div id="admin-view" class="stack hidden">
      <section class="scroll-x" id="admin-stats-row"></section>

      <section class="glass card">
        <div class="row row--wrap" style="margin-bottom:14px; gap:10px">
          <div class="search-bar glass-strong" style="flex:1;min-width:180px">
            <svg><use href="assets/svg/icons.svg#icon-search"></use></svg>
            <input id="admin-search" type="text" placeholder="Search student name…">
          </div>
          <div class="input-shell" style="width:auto;min-width:160px">
            <svg><use href="assets/svg/icons.svg#icon-calendar"></use></svg>
            <input id="admin-date-filter" type="date">
          </div>
        </div>
        <div class="row row--wrap" id="admin-status-pills" style="margin-bottom:16px; gap:8px"></div>

        <div class="row row--wrap no-print" style="margin-bottom:16px; gap:8px">
          <button class="btn btn--glass btn--sm" id="btn-export-csv"><svg><use href="assets/svg/icons.svg#icon-download"></use></svg> CSV</button>
          <button class="btn btn--glass btn--sm" id="btn-export-excel"><svg><use href="assets/svg/icons.svg#icon-download"></use></svg> Excel</button>
          <button class="btn btn--glass btn--sm" id="btn-export-pdf"><svg><use href="assets/svg/icons.svg#icon-download"></use></svg> PDF</button>
          <button class="btn btn--glass btn--sm" id="btn-print"><svg><use href="assets/svg/icons.svg#icon-print"></use></svg> Print</button>
        </div>

        <div id="admin-table-wrap" class="table-wrap"></div>
      </section>
    </div>
  </main>
</div>

<!-- Edit attendance modal (admin) -->
<div class="modal-overlay" id="modal-edit-attendance">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3>Edit Attendance</h3>
      <button class="icon-btn" data-close-modal><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-x"></use></svg></button>
    </div>
    <form id="edit-attendance-form" class="stack">
      <input type="hidden" id="edit-attendance-id">
      <div class="field">
        <label>Status</label>
        <div class="status-picker" id="edit-status-picker"></div>
      </div>
      <div class="field">
        <label for="edit-attendance-reason">Reason (optional)</label>
        <div class="input-shell">
          <input id="edit-attendance-reason" type="text" placeholder="Reason">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn--glass" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn--primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/attendance.js"></script>
</body>
</html>
