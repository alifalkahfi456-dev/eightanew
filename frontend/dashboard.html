<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — Class Management</title>
<link rel="icon" href="assets/svg/icons.svg#icon-sparkle" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<div class="bg-orbs"></div>
<div id="loading-screen">
  <div class="loader-mark"><svg><use href="assets/svg/icons.svg#icon-sparkle"></use></svg></div>
  <div class="loader-bar"></div>
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fb0ff"/>
      <stop offset="100%" stop-color="#0568d6"/>
    </linearGradient>
  </defs>
</svg>

<div class="app-shell page-grid page-grid--main-side">
  <div id="tabbar-root"></div>

  <main class="stack stagger">
    <div id="topbar-root" class="topbar"></div>

    <!-- Hero -->
    <section class="glass hero">
      <div class="hero__top">
        <div>
          <p class="hero__greeting" id="greeting-text">Hello</p>
          <p class="hero__date" id="date-text">Loading date…</p>
        </div>
        <div class="ring-wrap">
          <svg viewBox="0 0 80 80">
            <circle class="ring-track" cx="40" cy="40" r="34"></circle>
            <circle class="ring-value" id="attendance-ring" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="213.6"></circle>
          </svg>
          <div class="ring-center">
            <strong id="ring-percent">–</strong>
            <small>RATE</small>
          </div>
        </div>
      </div>
    </section>

    <!-- Today's attendance -->
    <section class="glass card" id="attendance-widget">
      <div class="skeleton sk-line" style="width:40%"></div>
      <div class="skeleton sk-line" style="width:70%"></div>
    </section>

    <!-- Quick stats -->
    <section class="scroll-x" id="stats-row">
      <div class="glass tile skeleton" style="min-width:110px;height:80px"></div>
      <div class="glass tile skeleton" style="min-width:110px;height:80px"></div>
      <div class="glass tile skeleton" style="min-width:110px;height:80px"></div>
    </section>

    <!-- Today's schedule -->
    <section class="glass card">
      <div class="row row--between" style="margin-bottom:12px">
        <h3 class="card-title">Today's Schedule</h3>
        <a href="schedule.html" class="card-link">View all <svg><use href="assets/svg/icons.svg#icon-chevron-right"></use></svg></a>
      </div>
      <div id="schedule-today" class="list-card">
        <div class="skeleton sk-line" style="width:90%"></div>
        <div class="skeleton sk-line" style="width:70%"></div>
      </div>
    </section>

    <!-- Today's cleaning duty -->
    <section class="glass card">
      <div class="row row--between" style="margin-bottom:12px">
        <h3 class="card-title">Cleaning Duty Today</h3>
        <a href="more.html#cleaning" class="card-link">View week <svg><use href="assets/svg/icons.svg#icon-chevron-right"></use></svg></a>
      </div>
      <div id="cleaning-today"></div>
    </section>

    <!-- Homework preview -->
    <section class="glass card">
      <div class="row row--between" style="margin-bottom:12px">
        <h3 class="card-title">Homework</h3>
        <a href="homework.html" class="card-link">View all <svg><use href="assets/svg/icons.svg#icon-chevron-right"></use></svg></a>
      </div>
      <div id="homework-preview" class="list-card"></div>
    </section>

    <!-- Announcements preview -->
    <section class="glass card" style="margin-bottom:8px">
      <div class="row row--between" style="margin-bottom:12px">
        <h3 class="card-title">Announcements</h3>
        <a href="announcement.html" class="card-link">View all <svg><use href="assets/svg/icons.svg#icon-chevron-right"></use></svg></a>
      </div>
      <div id="announcement-preview" class="list-card"></div>
    </section>
  </main>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
