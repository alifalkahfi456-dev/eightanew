<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Panel — Class Management</title>
<link rel="icon" href="assets/svg/icons.svg#icon-sparkle" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<div class="bg-orbs"></div>
<div id="loading-screen">
  <div class="loader-mark"><svg><use href="assets/svg/icons.svg#icon-sparkle"></use></svg></div>
  <div class="loader-bar"></div>
</div>

<div class="app-shell page-grid page-grid--main-side">
  <div id="tabbar-root"></div>

  <main class="stack stagger">
    <div id="topbar-root" class="topbar"></div>
    <div class="row row--between">
      <div>
        <p class="text-eyebrow">Administrator</p>
        <h1 class="text-display text-xl" style="margin-top:2px">Admin Panel</h1>
      </div>
      <span class="status-chip__dot" style="background:var(--ink-900);width:44px;height:44px"><svg class="icon"><use href="assets/svg/icons.svg#icon-shield"></use></svg></span>
    </div>

    <!-- Stat tiles -->
    <section class="grid-2 sm:grid-2" id="admin-overview" style="grid-template-columns:repeat(2,1fr)"></section>

    <!-- Charts -->
    <section class="page-grid" style="grid-template-columns:1fr; gap:16px" id="charts-wrap">
      <div class="glass card">
        <h3 class="card-title" style="margin-bottom:14px">Attendance — Last 7 Days</h3>
        <div id="attendance-chart"></div>
      </div>
      <div class="glass card">
        <h3 class="card-title" style="margin-bottom:14px">Homework by Subject</h3>
        <div id="homework-chart" class="stack" style="gap:10px"></div>
      </div>
    </section>

    <!-- Recent activity -->
    <section class="glass card">
      <h3 class="card-title" style="margin-bottom:14px">Recent Activity</h3>
      <div id="activity-list" class="list-card"></div>
    </section>

    <!-- Manage links -->
    <section class="grid-2 sm:grid-2" style="grid-template-columns:repeat(2,1fr)">
      <a href="attendance.html" class="glass card clickable stack" style="gap:10px; text-decoration:none; color:inherit">
        <span class="status-chip__dot" style="background:var(--status-present);width:40px;height:40px"><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-calendar"></use></svg></span>
        <span class="font-semibold text-sm">Manage Attendance</span>
      </a>
      <a href="homework.html" class="glass card clickable stack" style="gap:10px; text-decoration:none; color:inherit">
        <span class="status-chip__dot" style="background:var(--blue-500);width:40px;height:40px"><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-book"></use></svg></span>
        <span class="font-semibold text-sm">Manage Homework</span>
      </a>
      <a href="schedule.html" class="glass card clickable stack" style="gap:10px; text-decoration:none; color:inherit">
        <span class="status-chip__dot" style="background:var(--status-late);width:40px;height:40px"><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-clock"></use></svg></span>
        <span class="font-semibold text-sm">Manage Schedule</span>
      </a>
      <a href="cleaning.html" class="glass card clickable stack" style="gap:10px; text-decoration:none; color:inherit">
        <span class="status-chip__dot" style="background:var(--status-permission);width:40px;height:40px"><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-broom"></use></svg></span>
        <span class="font-semibold text-sm">Cleaning Duty</span>
      </a>
      <a href="announcement.html" class="glass card clickable stack" style="gap:10px; text-decoration:none; color:inherit; grid-column:1 / -1">
        <span class="status-chip__dot" style="background:var(--info);width:40px;height:40px"><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-megaphone"></use></svg></span>
        <span class="font-semibold text-sm">Manage Announcements</span>
      </a>
    </section>

    <!-- Student management -->
    <section class="glass card">
      <div class="row row--between" style="margin-bottom:14px">
        <h3 class="card-title">Students</h3>
        <span class="badge badge--info" id="student-count-badge">0 total</span>
      </div>
      <div class="row row--wrap" style="gap:10px; margin-bottom:12px">
        <div class="search-bar glass-strong" style="flex:1;min-width:180px">
          <svg><use href="assets/svg/icons.svg#icon-search"></use></svg>
          <input id="student-search" type="text" placeholder="Search students…">
        </div>
      </div>
      <div class="row" id="student-status-pills" style="gap:8px; margin-bottom:14px"></div>
      <div id="student-table-wrap" class="table-wrap"></div>
    </section>

    <!-- Settings -->
    <section class="glass card" style="margin-bottom:8px">
      <h3 class="card-title" style="margin-bottom:14px">Settings</h3>
      <form id="settings-form" class="stack">
        <div class="grid-2">
          <div class="field">
            <label for="set-school-name">School Name</label>
            <div class="input-shell"><input id="set-school-name" type="text" required></div>
          </div>
          <div class="field">
            <label for="set-class-name">Class Name</label>
            <div class="input-shell"><input id="set-class-name" type="text" required></div>
          </div>
        </div>
        <div class="field">
          <label>Logo</label>
          <div class="row" style="gap:10px">
            <label class="btn btn--glass btn--sm" style="cursor:pointer">
              <svg><use href="assets/svg/icons.svg#icon-image"></use></svg> Choose Image
              <input type="file" id="set-logo-input" accept="image/*" class="hidden">
            </label>
            <span id="set-logo-name" class="text-sm text-muted">No file selected</span>
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="set-attendance-time">Attendance Opens At</label>
            <div class="input-shell"><input id="set-attendance-time" type="time" required></div>
          </div>
          <div class="field">
            <label for="set-attendance-close">Attendance Closes At</label>
            <div class="input-shell"><input id="set-attendance-close" type="time" required></div>
          </div>
        </div>
        <div class="field">
          <label for="set-theme">Theme</label>
          <div class="input-shell">
            <select id="set-theme">
              <option value="blue">Blue &amp; White (default)</option>
              <option value="midnight">Midnight Blue</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Save Settings</button>
      </form>
    </section>
  </main>
</div>

<!-- Reset password modal -->
<div class="modal-overlay" id="modal-reset-password">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3>Reset Password</h3>
      <button class="icon-btn" data-close-modal><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-x"></use></svg></button>
    </div>
    <form id="reset-password-form" class="stack">
      <input type="hidden" id="reset-student-id">
      <p class="text-sm text-muted" id="reset-student-name"></p>
      <div class="field">
        <label for="reset-new-password">New Password</label>
        <div class="input-shell">
          <svg><use href="assets/svg/icons.svg#icon-lock"></use></svg>
          <input id="reset-new-password" type="text" placeholder="At least 6 characters" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn--glass" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn--primary">Reset Password</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
