<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule — Class Management</title>
<link rel="icon" href="assets/svg/icons.svg#icon-sparkle" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<div class="bg-orbs"></div>
<div id="loading-screen">
  <div class="loader-mark"><svg><use href="assets/svg/icons.svg#icon-sparkle"></use></svg></div>
  <div class="loader-bar"></div>
</div>

<div class="app-shell page-grid page-grid--main-side">
  <div id="tabbar-root"></div>

  <main class="stack stagger">
    <div id="topbar-root" class="topbar"></div>
    <h1 class="text-display text-xl">Weekly Schedule</h1>

    <section class="glass card--tight glass-strong" style="padding:14px">
      <div class="search-bar">
        <svg><use href="assets/svg/icons.svg#icon-search"></use></svg>
        <input id="sc-search" type="text" placeholder="Search subject, teacher or room…">
      </div>
    </section>

    <section class="scroll-x" id="sc-day-pills" style="gap:8px"></section>

    <section id="sc-list" class="stack"></section>
  </main>
</div>

<button class="fab" id="fab-add-schedule" aria-label="Add schedule">
  <svg><use href="assets/svg/icons.svg#icon-plus"></use></svg>
</button>

<!-- Create/Edit schedule modal (admin) -->
<div class="modal-overlay" id="modal-schedule">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 id="sc-modal-title">New Class</h3>
      <button class="icon-btn" data-close-modal><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-x"></use></svg></button>
    </div>
    <form id="schedule-form" class="stack">
      <input type="hidden" id="sc-id">
      <div class="field">
        <label for="sc-day">Day</label>
        <div class="input-shell">
          <svg><use href="assets/svg/icons.svg#icon-calendar"></use></svg>
          <select id="sc-day" required>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="sc-start">Start Time</label>
          <div class="input-shell"><input id="sc-start" type="time" required></div>
        </div>
        <div class="field">
          <label for="sc-end">End Time</label>
          <div class="input-shell"><input id="sc-end" type="time" required></div>
        </div>
      </div>
      <div class="field">
        <label for="sc-subject">Subject</label>
        <div class="input-shell"><input id="sc-subject" type="text" placeholder="Mathematics" required></div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="sc-teacher">Teacher</label>
          <div class="input-shell"><input id="sc-teacher" type="text" placeholder="Mr. Smith" required></div>
        </div>
        <div class="field">
          <label for="sc-room">Room</label>
          <div class="input-shell"><input id="sc-room" type="text" placeholder="101" required></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn--glass" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn--primary" id="sc-submit-btn">Save Class</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/schedule.js"></script>
</body>
</html>
