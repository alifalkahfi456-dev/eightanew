<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Account — Class Management</title>
<link rel="icon" href="assets/svg/icons.svg#icon-sparkle" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<div class="bg-orbs"></div>
<div id="loading-screen">
  <div class="loader-mark"><svg><use href="assets/svg/icons.svg#icon-sparkle"></use></svg></div>
  <div class="loader-bar"></div>
</div>

<div class="auth-shell page-enter">
  <div class="auth-card glass">
    <div class="auth-mark"><svg><use href="assets/svg/icons.svg#icon-sparkle"></use></svg></div>
    <h1 class="auth-title text-display">Create your account</h1>
    <p class="auth-sub">Join your class to track attendance and homework.</p>

    <form id="register-form" class="stack" novalidate>
      <div class="field" id="field-name">
        <label for="register-name">Full Name</label>
        <div class="input-shell">
          <svg><use href="assets/svg/icons.svg#icon-user"></use></svg>
          <input id="register-name" type="text" placeholder="e.g. Jane Doe" autocomplete="name" required>
        </div>
        <span class="field-error"></span>
      </div>

      <div class="field" id="field-password">
        <label for="register-password">Password</label>
        <div class="input-shell">
          <svg><use href="assets/svg/icons.svg#icon-lock"></use></svg>
          <input id="register-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" required>
          <button type="button" class="eye-toggle" onclick="togglePasswordField('register-password', this)" aria-label="Show password">
            <svg class="icon-sm"><use href="assets/svg/icons.svg#icon-eye"></use></svg>
          </button>
        </div>
        <span class="field-error"></span>
      </div>

      <div class="field" id="field-confirm">
        <label for="register-confirm">Confirm Password</label>
        <div class="input-shell">
          <svg><use href="assets/svg/icons.svg#icon-lock"></use></svg>
          <input id="register-confirm" type="password" placeholder="Re-enter your password" autocomplete="new-password" required>
          <button type="button" class="eye-toggle" onclick="togglePasswordField('register-confirm', this)" aria-label="Show password">
            <svg class="icon-sm"><use href="assets/svg/icons.svg#icon-eye"></use></svg>
          </button>
        </div>
        <span class="field-error"></span>
      </div>

      <button type="submit" id="register-submit" class="btn btn--primary btn--block" style="margin-top:6px">
        <svg><use href="assets/svg/icons.svg#icon-chevron-right"></use></svg>
        Create Account
      </button>
    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script>initRegisterPage();</script>
</body>
</html>
