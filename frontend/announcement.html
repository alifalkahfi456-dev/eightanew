<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Announcements — Class Management</title>
<link rel="icon" href="assets/svg/icons.svg#icon-sparkle" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
<div class="bg-orbs"></div>
<div id="loading-screen">
  <div class="loader-mark"><svg><use href="assets/svg/icons.svg#icon-sparkle"></use></svg></div>
  <div class="loader-bar"></div>
</div>

<div class="app-shell page-grid page-grid--main-side">
  <div id="tabbar-root"></div>

  <main class="stack stagger">
    <div id="topbar-root" class="topbar"></div>
    <div class="row row--between">
      <h1 class="text-display text-xl">Announcements</h1>
      <a href="more.html" class="icon-btn" aria-label="Back to More"><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-arrow-left"></use></svg></a>
    </div>

    <section class="glass card--tight glass-strong" style="padding:14px">
      <div class="search-bar">
        <svg><use href="assets/svg/icons.svg#icon-search"></use></svg>
        <input id="an-search" type="text" placeholder="Search announcements…">
      </div>
    </section>

    <section class="row" id="an-pills" style="gap:8px"></section>

    <section id="an-list" class="stack"></section>
  </main>
</div>

<button class="fab" id="fab-add-announcement" aria-label="Add announcement">
  <svg><use href="assets/svg/icons.svg#icon-plus"></use></svg>
</button>

<!-- Create/Edit announcement modal (admin) -->
<div class="modal-overlay" id="modal-announcement">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 id="an-modal-title">New Announcement</h3>
      <button class="icon-btn" data-close-modal><svg class="icon-sm"><use href="assets/svg/icons.svg#icon-x"></use></svg></button>
    </div>
    <form id="announcement-form" class="stack">
      <input type="hidden" id="an-id">
      <div class="field">
        <label for="an-title">Title</label>
        <div class="input-shell"><input id="an-title" type="text" placeholder="Welcome to the new semester!" required></div>
      </div>
      <div class="field">
        <label for="an-content">Content</label>
        <textarea id="an-content" class="input-area" placeholder="Write your announcement…" required></textarea>
      </div>
      <label class="checkbox-tile" style="cursor:pointer">
        <input type="checkbox" id="an-pinned">
        <span class="text-sm font-semibold">Pin this announcement to the top</span>
      </label>
      <div class="modal-footer">
        <button type="button" class="btn btn--glass" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn--primary" id="an-submit-btn">Publish</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/toast.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/announcement.js"></script>
</body>
</html>
